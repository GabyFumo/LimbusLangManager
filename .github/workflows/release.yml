name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Installation de Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compilation du .exe Wails
        run: wails build -clean

      - name: Création de la Release et Upload du .exe
        uses: softprops/action-gh-release@v2
        with:
          name: "Limbus Language Manager ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            build/bin/*.exe